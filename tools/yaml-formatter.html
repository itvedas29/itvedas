<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YAML formatter and validator. Format and validate YAML configuration files.">
<meta property="og:title" content="YAML Formatter | IT Vedas">
<meta property="og:description" content="YAML formatter and validator. Format and validate YAML configuration files.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://www.itvedas.com/tools/yaml-formatter">>
  <title>YAML Formatter | IT Vedas</title>
<link rel="canonical" href="https://www.itvedas.com/tools/yaml-formatter">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #EEF3FC;
      color: #182238;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 2rem;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .description { color: #6B7A94; margin-bottom: 2rem; }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: transparent;
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10B981;
    }
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .editor {
      background: #FFFFFF;
      border: 1px solid rgba(24,34,56,0.12);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .editor-label { font-weight: 600; margin-bottom: 0.75rem; font-size: 0.9rem; color: #6B7A94; }
    textarea {
      width: 100%;
      height: 400px;
      background: #EEF3FC;
      border: 1px solid rgba(24,34,56,0.15);
      color: #10B981;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #10B981; }
    .status {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      display: block;
    }
    @media (max-width: 1024px) {
      .editor-container { grid-template-columns: 1fr; }
      textarea { height: 300px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>⚙️ YAML Formatter</h1>
    <p class="description">Format and validate YAML configuration files with instant feedback.</p>

    <div class="controls">
      <button data-onclick="formatYAML" class="handler-formatYAML">Format</button>
      <button data-onclick="validateYAML" class="handler-validateYAML" class="secondary">Validate</button>
      <button data-onclick="copyOutput" class="handler-copyOutput" class="secondary">📋 Copy</button>
      <button data-onclick="clearAll" class="handler-clearAll" class="secondary">Clear</button>
    </div>

    <div class="editor-container">
      <div class="editor">
        <div class="editor-label">Input YAML</div>
        <textarea id="input" placeholder='Paste your YAML here...'></textarea>
        <div class="status" id="inputStatus"></div>
      </div>
      <div class="editor">
        <div class="editor-label">Output YAML</div>
        <textarea id="output" readonly placeholder='Formatted YAML will appear here...'></textarea>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    function formatYAML() {
      const input = document.getElementById('input').value;
      if (!input) return;

      try {
        const parsed = jsyaml.load(input);
        const formatted = jsyaml.dump(parsed, { lineWidth: -1 });
        document.getElementById('output').value = formatted;
        document.getElementById('inputStatus').textContent = '✓ Valid YAML';
        document.getElementById('inputStatus').className = 'status success';
      } catch (e) {
        document.getElementById('inputStatus').textContent = '✗ Invalid YAML: ' + e.message;
        document.getElementById('inputStatus').className = 'status error';
      }
    }

    function validateYAML() {
      const input = document.getElementById('input').value;
      if (!input) return;

      try {
        jsyaml.load(input);
        document.getElementById('inputStatus').textContent = '✓ Valid YAML syntax';
        document.getElementById('inputStatus').className = 'status success';
      } catch (e) {
        document.getElementById('inputStatus').textContent = '✗ Invalid YAML: ' + e.message;
        document.getElementById('inputStatus').className = 'status error';
      }
    }

    function copyOutput() {
      const output = document.getElementById('output').value;
      if (!output) return;
      navigator.clipboard.writeText(output).then(() => {
        const btn = event.target;
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
      });
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('inputStatus').className = 'status';
    }
  </script>
<script src="/js/inline-handler-setup.js" defer></script>

</html><script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",

  "url": "https://www.itvedas.com/tools/yaml-formatter/",
  "applicationCategory": "UtilityApplication",
  "operatingSystem": "Web"
}
</script>
</body>
</html>
