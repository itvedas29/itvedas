<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>🔐 SSL Certificate Info</h1>

    <div class="input-section">
      <textarea id="certPEM" placeholder="Paste SSL certificate in PEM format (-----BEGIN CERTIFICATE----- to -----END CERTIFICATE-----)"></textarea>
      <button onclick="parseCertificate()">Parse Certificate</button>
    </div>

    <div class="results" id="results">
      <div id="certInfo"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.3/jsrsasign-all-min.js"></script>
  <script>
    function parseCertificate() {
      const pem = document.getElementById('certPEM').value;
      if (!pem) return;

      try {
        const x509 = new X509();
        x509.readCertPEM(pem);

        const subject = x509.getSubjectString();
        const issuer = x509.getIssuerString();
        const notBefore = x509.getNotBefore();
        const notAfter = x509.getNotAfter();
        const serialNum = x509.getSerialNumberHex();

        const now = new Date();
        const expireDate = new Date(notAfter);
        let status = 'valid';
        let statusClass = 'badge-valid';

        if (expireDate < now) {
          status = 'EXPIRED';
          statusClass = 'badge-expired';
        } else {
          const daysUntilExpire = Math.floor((expireDate - now) / (1000 * 60 * 60 * 24));
          if (daysUntilExpire < 30) {
            status = `EXPIRING SOON (${daysUntilExpire} days)`;
            statusClass = 'badge-expiring';
          } else {
            status = `VALID (${daysUntilExpire} days remaining)`;
          }
        }

        const info = `
          <div class="info-row">
            <div class="info-label">Status</div>
            <div class="info-value"><span class="status-badge ${statusClass}">${status}</span></div>
          </div>
          <div class="info-row">
            <div class="info-label">Subject</div>
            <div class="info-value">${subject}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Issuer</div>
            <div class="info-value">${issuer}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Serial Number</div>
            <div class="info-value">${serialNum}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Valid From</div>
            <div class="info-value">${notBefore}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Valid Until</div>
            <div class="info-value">${notAfter}</div>
          </div>
        `;

        document.getElementById('certInfo').innerHTML = info;
        document.getElementById('results').classList.add('active');
      } catch (e) {
        document.getElementById('certInfo').innerHTML = `<div style="color: #F87171;">Error parsing certificate: ${e.message}</div>`;
        document.getElementById('results').classList.add('active');
      }
    }
  </script>
