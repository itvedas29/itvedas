<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>🔐 Base64 Encoder/Decoder</h1>
    <p class="description">Convert text to Base64 encoding and decode Base64 strings instantly with instant validation.</p>

    <div class="controls">
      <button onclick="encodeBase64()">Encode to Base64</button>
      <button onclick="decodeBase64()" class="secondary">Decode from Base64</button>
      <button onclick="copyOutput()" class="secondary">📋 Copy Output</button>
      <button onclick="clearAll()" class="secondary">Clear</button>
    </div>

    <div class="editor-container">
      <div class="editor">
        <div class="editor-label">Input</div>
        <textarea id="input" placeholder='Paste text or Base64 here...'></textarea>
        <div class="status" id="inputStatus"></div>
      </div>
      <div class="editor">
        <div class="editor-label">Output</div>
        <textarea id="output" readonly placeholder='Encoded/Decoded result will appear here...'></textarea>
        <div class="status" id="outputStatus"></div>
      </div>
    </div>
  </div>

  <script>
    function encodeBase64() {
      const input = document.getElementById('input').value;
      if (!input) return;

      try {
        const encoded = btoa(unescape(encodeURIComponent(input)));
        document.getElementById('output').value = encoded;
        document.getElementById('inputStatus').textContent = '✓ Encoded successfully';
        document.getElementById('inputStatus').className = 'status success';
      } catch (e) {
        document.getElementById('inputStatus').textContent = '✗ Encoding error: ' + e.message;
        document.getElementById('inputStatus').className = 'status error';
      }
    }

    function decodeBase64() {
      const input = document.getElementById('input').value;
      if (!input) return;

      try {
        const decoded = decodeURIComponent(escape(atob(input)));
        document.getElementById('output').value = decoded;
        document.getElementById('inputStatus').textContent = '✓ Decoded successfully';
        document.getElementById('inputStatus').className = 'status success';
      } catch (e) {
        document.getElementById('inputStatus').textContent = '✗ Invalid Base64: ' + e.message;
        document.getElementById('inputStatus').className = 'status error';
      }
    }

    function copyOutput() {
      const output = document.getElementById('output').value;
      if (!output) return;
      navigator.clipboard.writeText(output).then(() => {
        const btn = event.target;
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy Output'; }, 2000);
      });
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('inputStatus').className = 'status';
    }
  </script>
