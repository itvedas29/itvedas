<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DNS lookup tool. Query DNS records (A, AAAA, CNAME, MX, TXT). Educational DNS lookup simulator.">
<meta property="og:title" content="DNS Lookup | IT Vedas">
<meta property="og:description" content="DNS lookup tool. Query DNS records (A, AAAA, CNAME, MX, TXT). Educational DNS lookup simulator.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://www.itvedas.com/tools/dns-lookup">>
  <title>DNS Lookup | IT Vedas</title>
<link rel="canonical" href="https://www.itvedas.com/tools/dns-lookup">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #EEF3FC;
      color: #182238;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 2rem; }
    .search-section {
      background: #FFFFFF;
      border: 1px solid rgba(24,34,56,0.12);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .input-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    input {
      flex: 1;
      background: #EEF3FC;
      border: 1px solid rgba(24,34,56,0.15);
      color: #182238;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: #10B981; }
    button {
      padding: 0.75rem 1.5rem;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .record-type-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .record-btn {
      padding: 0.5rem 1rem;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #6366F1;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .record-btn.active {
      background: #6366F1;
      color: white;
      border-color: #6366F1;
    }
    .results {
      background: #FFFFFF;
      border: 1px solid rgba(24,34,56,0.12);
      border-radius: 12px;
      padding: 1.5rem;
      display: none;
    }
    .results.active { display: block; }
    .record-item {
      background: #EEF3FC;
      border-left: 3px solid #6366F1;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border-radius: 6px;
    }
    .record-type {
      font-weight: 600;
      color: #6366F1;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .record-value {
      color: #4A5568;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .info-text {
      color: #6B7A94;
      font-size: 0.9rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(24,34,56,0.12);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>🌐 DNS Lookup</h1>

    <div class="search-section">
      <div class="input-group">
        <input type="text" id="domain" placeholder="Enter domain (e.g., example.com)">
        <button data-onclick="lookupDNS" class="handler-lookupDNS">Lookup</button>
      </div>
      <div class="record-type-buttons">
        <button class="record-btn active" data-onclick="setRecordType" data-arg="A" class="handler-setRecordType">A</button>
        <button class="record-btn" data-onclick="setRecordType" data-arg="AAAA" class="handler-setRecordType">AAAA</button>
        <button class="record-btn" data-onclick="setRecordType" data-arg="CNAME" class="handler-setRecordType">CNAME</button>
        <button class="record-btn" data-onclick="setRecordType" data-arg="MX" class="handler-setRecordType">MX</button>
        <button class="record-btn" data-onclick="setRecordType" data-arg="TXT" class="handler-setRecordType">TXT</button>
      </div>
    </div>

    <div class="results" id="results">
      <h2 style="margin-bottom: 1.5rem; color: #6366F1;" id="resultTitle"></h2>
      <div id="resultsList"></div>
      <div class="info-text">
        <strong>Note:</strong> This is an educational tool showing example DNS records. For real DNS lookups, use nslookup, dig, or host commands.
      </div>
    </div>
  </div>

  <script>
    let currentRecordType = 'A';

    const sampleRecords = {
      'A': { 'example.com': '93.184.216.34', 'google.com': '142.250.185.46' },
      'AAAA': { 'example.com': '2606:2800:220:1:248:1893:25c8:1946', 'google.com': '2607:f8b0:4004:80d::200e' },
      'CNAME': { 'www.example.com': 'example.com', 'mail.example.com': 'mail.google.com' },
      'MX': { 'example.com': '10 mail.example.com', 'google.com': '10 smtp.google.com' },
      'TXT': { 'example.com': 'v=spf1 -all', 'google.com': 'v=spf1 include:_spf.google.com ~all' }
    };

    function setRecordType(type) {
      currentRecordType = type;
      document.querySelectorAll('.record-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function lookupDNS() {
      const domain = document.getElementById('domain').value.toLowerCase().trim();
      if (!domain) return;

      const records = sampleRecords[currentRecordType];
      const result = records[domain];

      const resultsList = document.getElementById('resultsList');
      const resultTitle = document.getElementById('resultTitle');

      resultTitle.textContent = `${currentRecordType} Records for ${domain}`;

      if (result) {
        if (Array.isArray(result)) {
          resultsList.innerHTML = result.map(r => `
            <div class="record-item">
              <div class="record-type">${currentRecordType}</div>
              <div class="record-value">${r}</div>
            </div>
          `).join('');
        } else {
          resultsList.innerHTML = `
            <div class="record-item">
              <div class="record-type">${currentRecordType}</div>
              <div class="record-value">${result}</div>
            </div>
          `;
        }
      } else {
        resultsList.innerHTML = `<div style="color: #6B7A94;">No ${currentRecordType} records found (sample data only)</div>`;
      }

      document.getElementById('results').classList.add('active');
    }
  </script>
<script src="/js/inline-handler-setup.js" defer></script>

</html><script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "DNS Lookup | IT Vedas",
  "description": "DNS lookup tool. Query DNS records (A, AAAA, CNAME, MX, TXT). Educational DNS lookup simulator.",
  "url": "https://www.itvedas.com/tools/dns-lookup/",
  "applicationCategory": "UtilityApplication",
  "operatingSystem": "Web"
}
</script>
</body>
</html>
