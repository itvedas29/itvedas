<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hash generator supporting MD5, SHA1, SHA256, SHA512. Generate cryptographic hashes instantly."
<meta property="og:title" content="Hash Generator | IT Vedas">
<meta property="og:description" content="Hash generator supporting MD5, SHA1, SHA256, SHA512. Generate cryptographic hashes instantly.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://www.itvedas.com/tools/hash-generator.html">>
  <title>Hash Generator | IT Vedas</title>
<link rel="canonical" href="https://www.itvedas.com/tools/hash-generator.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0A0F;
      color: #F0F0F8;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .description { color: #8888A8; margin-bottom: 2rem; }
    .input-section {
      background: #13131C;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    textarea {
      width: 100%;
      height: 150px;
      background: #0A0A0F;
      border: 1px solid rgba(255,255,255,0.1);
      color: #10B981;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      margin-bottom: 1rem;
    }
    textarea:focus { outline: none; border-color: #10B981; }
    .hash-options {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .results {
      background: #13131C;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .hash-item {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hash-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .hash-name {
      min-width: 100px;
      font-weight: 600;
      color: #8888A8;
    }
    .hash-value {
      flex: 1;
      background: #0A0A0F;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      word-break: break-all;
      color: #6EE7B7;
    }
    .copy-btn {
      background: #10B981;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .copy-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>🔐 Hash Generator</h1>
    <p class="description">Generate cryptographic hashes (MD5, SHA1, SHA256, SHA512) for text and files instantly.</p>

    <div class="input-section">
      <textarea id="input" placeholder="Enter text to hash..."></textarea>
      <div class="hash-options">
        <button data-onclick="generateHashes" class="handler-generateHashes">Generate Hashes</button>
        <button data-onclick="clearAll" class="handler-clearAll" style="background:transparent;border:1px solid rgba(16,185,129,0.4);color:#10B981;">Clear</button>
      </div>
    </div>

    <div class="results" id="results" style="display:none;">
      <div class="hash-item">
        <div class="hash-name">MD5:</div>
        <div class="hash-value" id="md5">-</div>
        <button class="copy-btn" data-onclick="copyHash" data-arg="md5" class="handler-copyHash">Copy</button>
      </div>
      <div class="hash-item">
        <div class="hash-name">SHA1:</div>
        <div class="hash-value" id="sha1">-</div>
        <button class="copy-btn" data-onclick="copyHash" data-arg="sha1" class="handler-copyHash">Copy</button>
      </div>
      <div class="hash-item">
        <div class="hash-name">SHA256:</div>
        <div class="hash-value" id="sha256">-</div>
        <button class="copy-btn" data-onclick="copyHash" data-arg="sha256" class="handler-copyHash">Copy</button>
      </div>
      <div class="hash-item">
        <div class="hash-name">SHA512:</div>
        <div class="hash-value" id="sha512">-</div>
        <button class="copy-btn" data-onclick="copyHash" data-arg="sha512" class="handler-copyHash">Copy</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.0/crypto-js.min.js"></script>
  <script>
    function generateHashes() {
      const text = document.getElementById('input').value;
      if (!text) return;

      document.getElementById('md5').textContent = CryptoJS.MD5(text).toString();
      document.getElementById('sha1').textContent = CryptoJS.SHA1(text).toString();
      document.getElementById('sha256').textContent = CryptoJS.SHA256(text).toString();
      document.getElementById('sha512').textContent = CryptoJS.SHA512(text).toString();
      document.getElementById('results').style.display = 'block';
    }

    function copyHash(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        btn.textContent = '✓ Copied';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      });
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('results').style.display = 'none';
    }
  </script>
<script src="/js/inline-handler-setup.js" defer></script>

</html></body>
</html>
