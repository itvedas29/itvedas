<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>📋 HTTP Header Analyzer</h1>

    <div class="input-section">
      <textarea id="headers" placeholder="Paste HTTP response headers here (one per line)&#10;Example:&#10;Content-Type: application/json&#10;X-Frame-Options: DENY&#10;Strict-Transport-Security: max-age=31536000"></textarea>
      <button onclick="analyzeHeaders()">Analyze Headers</button>
    </div>

    <div class="results" id="results">
      <h2 style="margin-bottom: 1.5rem; color: #6366F1;">Parsed Headers</h2>
      <div id="headersList"></div>
      <h2 style="margin-top: 2rem; margin-bottom: 1.5rem; color: #6366F1;">Security Check</h2>
      <div id="securityCheck"></div>
    </div>
  </div>

  <script>
    function analyzeHeaders() {
      const input = document.getElementById('headers').value;
      if (!input) return;

      const lines = input.split('\n').filter(line => line.trim());
      const headers = {};

      lines.forEach(line => {
        const [name, ...valueParts] = line.split(':');
        const value = valueParts.join(':').trim();
        if (name) headers[name.trim()] = value;
      });

      const headersList = document.getElementById('headersList');
      headersList.innerHTML = Object.entries(headers)
        .map(([name, value]) => `
          <div class="header-row">
            <div class="header-name">${name}</div>
            <div class="header-value">${value}</div>
          </div>
        `).join('');

      // Security analysis
      const securityCheck = document.getElementById('securityCheck');
      const checks = [];

      if (headers['Strict-Transport-Security']) {
        checks.push({ name: 'HSTS Enabled', status: 'good', value: headers['Strict-Transport-Security'] });
      } else {
        checks.push({ name: 'HSTS', status: 'bad', value: 'Missing - consider enabling' });
      }

      if (headers['X-Frame-Options']) {
        checks.push({ name: 'Clickjack Protection', status: 'good', value: headers['X-Frame-Options'] });
      } else {
        checks.push({ name: 'Clickjack Protection', status: 'warning', value: 'Missing' });
      }

      if (headers['X-Content-Type-Options'] === 'nosniff') {
        checks.push({ name: 'MIME Type Security', status: 'good', value: 'nosniff' });
      }

      securityCheck.innerHTML = checks
        .map(check => `
          <div class="header-row">
            <div class="header-name">${check.name}</div>
            <div style="flex: 1;"><span class="security-badge badge-${check.status}">${check.status.toUpperCase()}</span></div>
            <div class="header-value">${check.value}</div>
          </div>
        `).join('');

      document.getElementById('results').classList.add('active');
    }
  </script>
