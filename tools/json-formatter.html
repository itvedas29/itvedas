<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JSON formatter and validator. Format, minify, and validate JSON with syntax highlighting.">
<meta property="og:title" content="JSON Formatter - Validate & Format JSON | IT Vedas">
<meta property="og:description" content="JSON formatter and validator. Format, minify, and validate JSON with syntax highlighting.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://www.itvedas.com/tools/json-formatter">>
  <link rel="canonical" href="https://www.itvedas.com/tools/json-formatter">
  <title>JSON Formatter - Validate & Format JSON | IT Vedas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #EEF3FC;
      color: #182238;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 2rem;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; font-weight: 700; }
    .description { color: #6B7A94; margin-bottom: 2rem; font-size: 0.95rem; }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: transparent;
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10B981;
    }
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .editor {
      background: #FFFFFF;
      border: 1px solid rgba(24,34,56,0.12);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .editor-label { font-weight: 600; margin-bottom: 0.75rem; font-size: 0.9rem; color: #6B7A94; }
    textarea {
      width: 100%;
      height: 400px;
      background: #EEF3FC;
      border: 1px solid rgba(24,34,56,0.15);
      color: #10B981;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #10B981; }
    .status {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      display: block;
    }
    @media (max-width: 1024px) {
      .editor-container { grid-template-columns: 1fr; }
      textarea { height: 300px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/tools/" style="color: #10B981; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>{ } JSON Formatter</h1>
    <p class="description">Format, minify, and validate JSON with instant feedback and syntax highlighting.</p>

    <div class="controls">
      <button data-onclick="formatJSON" class="handler-formatJSON">Format</button>
      <button data-onclick="minifyJSON" class="handler-minifyJSON" class="secondary">Minify</button>
      <button data-onclick="copyOutput" class="handler-copyOutput" class="secondary">📋 Copy Output</button>
      <button data-onclick="clearAll" class="handler-clearAll" class="secondary">Clear</button>
    </div>

    <div class="editor-container">
      <div class="editor">
        <div class="editor-label">Input JSON</div>
        <textarea id="input" placeholder='Paste your JSON here...'></textarea>
        <div class="status" id="inputStatus"></div>
      </div>
      <div class="editor">
        <div class="editor-label">Output JSON</div>
        <textarea id="output" readonly placeholder='Formatted JSON will appear here...'></textarea>
        <div class="status" id="outputStatus"></div>
      </div>
    </div>
  </div>

  <script>
    function formatJSON() {
      const input = document.getElementById('input').value;
      const inputStatus = document.getElementById('inputStatus');

      try {
        const parsed = JSON.parse(input);
        const formatted = JSON.stringify(parsed, null, 2);
        document.getElementById('output').value = formatted;
        inputStatus.textContent = '✓ Valid JSON';
        inputStatus.className = 'status success';
      } catch (e) {
        inputStatus.textContent = '✗ Invalid JSON: ' + e.message;
        inputStatus.className = 'status error';
      }
    }

    function minifyJSON() {
      const input = document.getElementById('input').value;
      const inputStatus = document.getElementById('inputStatus');

      try {
        const parsed = JSON.parse(input);
        const minified = JSON.stringify(parsed);
        document.getElementById('output').value = minified;
        inputStatus.textContent = '✓ Valid JSON (minified)';
        inputStatus.className = 'status success';
      } catch (e) {
        inputStatus.textContent = '✗ Invalid JSON: ' + e.message;
        inputStatus.className = 'status error';
      }
    }

    function copyOutput() {
      const output = document.getElementById('output').value;
      if (!output) return;
      navigator.clipboard.writeText(output).then(() => {
        const btn = event.target;
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy Output'; }, 2000);
      });
    }

    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('inputStatus').className = 'status';
    }

    // Auto-format on input
    document.getElementById('input').addEventListener('input', () => {
      // Debounce
      clearTimeout(window.formatTimeout);
      window.formatTimeout = setTimeout(formatJSON, 500);
    });
  </script>
<script src="/js/inline-handler-setup.js" defer></script>

</html>
