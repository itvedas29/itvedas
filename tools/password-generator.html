  <style>

    .tool-section {

      border: 1px solid rgba(255,255,255,0.08);

    .form-group {

    label {

    button {

      background: #6366F1;

    }

      opacity: 0.9;

      background: transparent;
      border: 1px solid rgba(99, 102, 241, 0.4);

    .password-display {
      background: #0A0A0F;
      border: 2px solid rgba(99, 102, 241, 0.3);

      word-break: break-all;
      text-align: center;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6366F1;
      font-weight: 600;
    }
    .strength-indicator {
      height: 6px;
      background: #1C1C2A;
      border-radius: 3px;
      margin-top: 1rem;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
    }
    .strength-weak { background: #EF4444; width: 33%; }
    .strength-fair { background: #F59E0B; width: 66%; }
    .strength-good { background: #10B981; width: 100%; }

<body>
  <div class="container">
    <a href="/tools/" style="color: #6366F1; text-decoration: none; margin-bottom: 2rem; display: inline-block;">← Back to Tools</a>

    <h1>🔐 Password Generator</h1>
    <p class="description">Generate secure, random passwords with customizable requirements.</p>

    <div class="tool-section">
      <div class="form-group">
        <label for="length">Password Length: <span class="range-display" id="lengthDisplay">16</span></label>
        <input type="range" id="length" min="8" max="64" value="16">
      </div>

      <div class="form-group">
        <label>Character Sets</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="uppercase" checked>
            <label for="uppercase">Uppercase (A-Z)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="lowercase" checked>
            <label for="lowercase">Lowercase (a-z)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="numbers" checked>
            <label for="numbers">Numbers (0-9)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="symbols" checked>
            <label for="symbols">Symbols (!@#$%)</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="password-display" id="passwordDisplay">Click Generate</div>
        <div class="strength-indicator">
          <div class="strength-bar strength-good" id="strengthBar"></div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-generate" data-onclick="generatePassword" class="handler-generatePassword">Generate Password</button>
        <button class="btn-copy" data-onclick="copyToClipboard" class="handler-copyToClipboard">📋 Copy</button>
      </div>
    </div>
  </div>

  <script>
    function generatePassword() {
      const length = parseInt(document.getElementById('length').value);
      const useUppercase = document.getElementById('uppercase').checked;
      const useLowercase = document.getElementById('lowercase').checked;
      const useNumbers = document.getElementById('numbers').checked;
      const useSymbols = document.getElementById('symbols').checked;

      let charset = '';
      if (useUppercase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (useLowercase) charset += 'abcdefghijklmnopqrstuvwxyz';
      if (useNumbers) charset += '0123456789';
      if (useSymbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      if (!charset) {
        alert('Select at least one character set');
        return;
      }

      let password = '';
      for (let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }

      document.getElementById('passwordDisplay').textContent = password;
      updateStrengthIndicator(password);
    }

    function updateStrengthIndicator(password) {
      const strength = calculateStrength(password);
      const bar = document.getElementById('strengthBar');
      bar.className = 'strength-bar ' + strength;
    }

    function calculateStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.length >= 12) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[a-z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[!@#$%^&*]/.test(password)) strength++;

      if (strength <= 2) return 'strength-weak';
      if (strength <= 4) return 'strength-fair';
      return 'strength-good';
    }

    function copyToClipboard() {
      const password = document.getElementById('passwordDisplay').textContent;
      if (password === 'Click Generate') return;
      navigator.clipboard.writeText(password).then(() => {
        const btn = event.target;
        btn.textContent = '✓ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
      });
    }

    document.getElementById('length').addEventListener('input', (e) => {
      document.getElementById('lengthDisplay').textContent = e.target.value;
    });

    // Auto-generate on load
    generatePassword();
  </script>
<script src="/js/inline-handler-setup.js" defer></script>
