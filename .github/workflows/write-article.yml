name: ITVedas Autopilot

on:
  schedule:
    - cron: '30 3 * * 1,3,5'
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'What to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - article_only
          - news_only

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytrends "urllib3<2"

      - name: Run Brain (deep article)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 3 * * 1,3,5') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_type == 'both' || inputs.run_type == 'article_only'))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GA4_ID: ${{ secrets.GA4_ID }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY secret is not configured in GitHub Repository Secrets. Skipping deep article generation step."
            exit 0
          fi
          python3 itvedas-brain/content-writer.py

      - name: Run News Agent
        if: >-
          (github.event_name == 'schedule' && github.event.schedule != '30 3 * * 1,3,5') ||
          (github.event_name == 'workflow_dispatch' && (inputs.run_type == 'both' || inputs.run_type == 'news_only'))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GA4_ID: ${{ secrets.GA4_ID }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY secret is not configured in GitHub Repository Secrets. Skipping AI news rewrite step."
            exit 0
          fi
          python3 itvedas-brain/news-agent.py

      - name: Run news quality gate
        run: python3 scripts/news-quality-gate.py

      - name: Rebuild news archive
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
        run: python3 scripts/generate-news-archive.py

      - name: Rebuild sitemap
        run: python3 scripts/generate-sitemap.py

      - name: Commit and push
        run: |
          git config user.name "ITVedas Bot"
          git config user.email "bot@itvedas.com"
          git pull --rebase --autostash origin main
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Autopilot update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main || true
          fi
