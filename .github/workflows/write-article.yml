name: ITVedas Autopilot

# Traffic-recovery policy:
# - Deep articles: Mon/Wed/Fri at 09:00 IST.
# - News is NOT scheduled while search inventory is being recovered.
# - News can be run manually for curated releases only.
# - Generated changes are submitted as PRs so validation runs before merge.
# - Do not push generated content directly to main.
on:
  schedule:
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'What to run'
        required: true
        default: 'article_only'
        type: choice
        options: [article_only, news_only]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: itvedas-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytrends "urllib3<2"

      - name: Run Brain (deep article)
        if: github.event_name == 'schedule' || inputs.run_type == 'article_only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GA4_ID:            ${{ secrets.GA4_ID }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
          SMTP_FROM:         ${{ secrets.SMTP_FROM }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
        run: python3 itvedas-brain/content-writer.py

      - name: Run News Agent (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_type == 'news_only'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GA4_ID:            ${{ secrets.GA4_ID }}
        run: python3 itvedas-brain/news-agent.py

      - name: Rebuild news archive
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
        run: python3 scripts/generate-news-archive.py

      - name: Prepare pull request
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="autopilot/${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "ITVedas Bot"
          git config user.email "bot@itvedas.com"
          git add -A
          git commit -m "chore: autopilot update ${GITHUB_RUN_ID}"
          git push --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.changes.outputs.branch }}" \
            --title "Autopilot update ${{ github.run_id }}" \
            --body "Automated ITVedas content update. This PR must pass the repository validation workflow before merge."
