name: ITVedas Brain + News

on:
  schedule:
    # Deep articles: Mon, Wed, Fri at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * 1,3,5'
    # News updates: Every day at 8 AM, 1 PM, 6 PM IST
    - cron: '30 2 * * *'
    - cron: '30 7 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'What to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - article_only
          - news_only

permissions:
  contents: write

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run Deep Article Brain
        if: |
          github.event_name == 'workflow_dispatch' && (inputs.run_type == 'both' || inputs.run_type == 'article_only') ||
          github.event_name == 'schedule' && (github.event.schedule == '30 3 * * 1,3,5')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 scripts/brain_v2.py

      - name: Run News Agent
        if: |
          github.event_name == 'workflow_dispatch' && (inputs.run_type == 'both' || inputs.run_type == 'news_only') ||
          github.event_name == 'schedule' && (github.event.schedule != '30 3 * * 1,3,5')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/news_agent.py

      - name: Commit and push everything
        run: |
          git config user.name "ITVedas Brain"
          git config user.email "brain@itvedas.com"
          git add -A
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add -A
          git diff --staged --quiet || git commit -m "Auto update $(date +'%Y-%m-%d %H:%M')"
          git push origin main
