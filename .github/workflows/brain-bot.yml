name: ITVedas Brain Bot — Autonomous Content Publisher

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes — burst mode to publish all seeds fast
  workflow_dispatch:
    inputs:
      bot_mode:
        description: 'Run mode: article, audit, or sitemap'
        required: false
        default: 'article'

permissions:
  contents: write

jobs:
  brain-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run Brain Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
          GA4_ID: G-D98BFZSJYP
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          BOT_MODE: ${{ github.event.inputs.bot_mode || 'article' }}
        run: |
          cd itvedas-brain
          python brain-bot.py

      - name: Commit memory + state updates
        run: |
          git config user.name "itvedas-bot"
          git config user.email "bot@itvedas.com"
          git pull --rebase --autostash origin main
          git add itvedas-brain/memory/ itvedas-brain/state/ || true
          git diff --cached --quiet || git commit -m "brain-bot: update memory + state [skip ci]"
          git push origin main || true
