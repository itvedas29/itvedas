name: Refresh repository memory

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: itvedas-autopilot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh repository memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 itvedas-brain/repo-scanner.py

      - name: Commit refreshed memory
        run: |
          git config user.name "ITVedas Bot"
          git config user.email "bot@itvedas.com"
          git add itvedas-brain/memory/repository.json
          git diff --staged --quiet || git commit -m "Brain memory refresh $(date -u +'%Y-%m-%d')"
          git push origin main
