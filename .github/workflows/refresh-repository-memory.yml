name: Refresh ITVedas knowledge

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'news/**'
      - 'career-*.html'
      - 'functions/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'itvedas-brain/state/**'
      - 'itvedas-brain/repo-scanner.py'
      - 'itvedas-brain/knowledge-builder.py'
      - 'itvedas-brain/decision-engine.py'
      - 'itvedas-brain/execution-engine.py'
      - 'itvedas-brain/analytics-agent.py'
      - 'itvedas-brain/search-console-agent.py'
      - 'itvedas-brain/github-agent.py'
      - '.github/workflows/refresh-repository-memory.yml'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: itvedas-autopilot
  cancel-in-progress: false

jobs:
  build-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh repository memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 itvedas-brain/repo-scanner.py

      - name: Build repository knowledge
        run: python3 itvedas-brain/knowledge-builder.py

      - name: Pull GA4 analytics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ secrets.GA4_ACCESS_TOKEN }}
        run: python3 itvedas-brain/analytics-agent.py

      - name: Pull Search Console data
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
        run: python3 itvedas-brain/search-console-agent.py

      - name: Build daily decision plan
        run: python3 itvedas-brain/decision-engine.py

      - name: Build execution plan
        run: python3 itvedas-brain/execution-engine.py

      - name: Build GitHub action plan
        run: python3 itvedas-brain/github-agent.py

      - name: Validate generated knowledge
        run: |
          python3 -m json.tool itvedas-brain/memory/repository.json > /dev/null
          python3 -m json.tool itvedas-brain/memory/analytics.json > /dev/null
          python3 -m json.tool itvedas-brain/memory/search_console.json > /dev/null
          python3 -m json.tool itvedas-brain/repository_knowledge.json > /dev/null
          python3 -m json.tool itvedas-brain/state/daily-plan.json > /dev/null
          python3 -m json.tool itvedas-brain/state/execution-plan.json > /dev/null
          python3 -m json.tool itvedas-brain/state/github-actions.json > /dev/null
          for file in itvedas-brain/knowledge/*.json; do
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Commit refreshed knowledge
        run: |
          git config user.name "ITVedas Bot"
          git config user.email "bot@itvedas.com"
          git add itvedas-brain/memory/repository.json
          git add itvedas-brain/memory/analytics.json
          git add itvedas-brain/memory/search_console.json
          git add itvedas-brain/knowledge
          git add itvedas-brain/repository_knowledge.json
          git add itvedas-brain/state/daily-plan.json
          git add itvedas-brain/state/execution-plan.json
          git add itvedas-brain/state/github-actions.json
          git diff --staged --quiet || git commit -m "Brain knowledge refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
