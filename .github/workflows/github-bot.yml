name: ITVedas GitHub Bot — Conversational Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond:
    # Only run if: issue opened (not by the bot) OR comment mentions @itvedas-bot
    if: |
      (github.event_name == 'issues' && github.event.issue.user.login != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@itvedas-bot') && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Anthropic SDK
        run: pip install anthropic --quiet

      - name: Run GitHub Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          TRIGGERED_BY: ${{ github.event.comment.user.login || github.event.issue.user.login }}
        run: |
          cd itvedas-brain
          python github-bot.py
