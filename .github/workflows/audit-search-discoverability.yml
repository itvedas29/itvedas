name: Search discoverability audit

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - 'articles/**'
      - 'chapters/**'
      - 'news/**'
      - 'toolkit/**'
      - 'robots.txt'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'scripts/audit-search-discoverability.py'
      - '.github/workflows/audit-search-discoverability.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Audit SEO, GEO, AIO, and technical discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit the complete static site
        run: python3 scripts/audit-search-discoverability.py --root . --out-dir /tmp/itvedas-discoverability-audit

      - name: Add findings summary to workflow run
        if: always()
        run: |
          if [ -f /tmp/itvedas-discoverability-audit/discoverability-audit.md ]; then
            sed -n '1,80p' /tmp/itvedas-discoverability-audit/discoverability-audit.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Full findings are available in the \`itvedas-discoverability-audit\` workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The audit did not produce a report. Review the audit step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload detailed audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itvedas-discoverability-audit
          path: /tmp/itvedas-discoverability-audit/
          if-no-files-found: warn
          retention-days: 30
