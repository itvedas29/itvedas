name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate complete sitemap
        run: python3 scripts/generate-sitemap.py
      - name: Regenerate search index
        run: python3 scripts/generate-search-index.py
      - name: Validate JSON and CVE schema
        run: |
          python -m json.tool search-index.json > /tmp/search-index.json
          python -m json.tool cve-database-full.json > /tmp/cve.json
          python3 scripts/validate-cve-schema.py
      - name: Run security checks
        run: bash scripts/security-check.sh
      - name: Check JavaScript syntax
        run: |
          set -e
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
      - name: Verify Markdown preview sanitizes rendered HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('tools/markdown-preview.html').read_text(encoding='utf-8')
          sanitizer=Path('js/html-sanitizer.js').read_text(encoding='utf-8')
          checks=[
            ('shared sanitizer loaded','/js/html-sanitizer.js' in page),
            ('sanitized DOM insertion','HTMLSanitizer.setInnerHTML(preview, rendered)' in page),
            ('unsafe direct assignment removed','preview.innerHTML = marked.parse' not in page),
            ('link protocols validated',"['http:', 'https:'].includes(url.protocol)" in sanitizer),
            ('new-window links protected','noopener noreferrer' in sanitizer),
          ]
          failed=[n for n,ok in checks if not ok]
          if failed: print('\n'.join('FAILED: '+x for x in failed)); raise SystemExit(1)
          print('\n'.join('OK: '+x for x,_ in checks))
          PY
      - name: Verify GA4 script hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts: continue
            t=p.read_text(encoding='utf-8',errors='ignore')
            for tag in re.findall(r'<script\b[^>]*googletagmanager\.com/gtag/js[^>]*>',t,re.I):
              if re.search(r'\bintegrity\s*=',tag,re.I): bad.append(str(p))
          if bad:
            print('GA4 tags with mutable SRI:', '\n'.join(sorted(set(bad))))
            raise SystemExit(1)
          print('OK: no mutable GA4 gtag.js SRI attributes found')
          PY
      - name: Run news quality analysis
        run: python3 scripts/news-quality-gate.py
      - name: Validate sitemap excludes noindex pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          bad=[]
          for p in Path('news').rglob('*.html'):
            t=p.read_text(encoding='utf-8',errors='ignore')
            if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+noindex',t,re.I):
              url='https://www.itvedas.com/'+str(p.relative_to('.')).replace('index.html','').replace('.html','')
              if url.rstrip('/') in sitemap: bad.append(str(p))
          if bad: print('Noindex pages in sitemap:',bad); raise SystemExit(1)
          print('OK: noindex news pages excluded from sitemap')
          PY
      - name: Check generated article cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import glob
          quiz=Path('quiz.html').read_text(encoding='utf-8'); index=Path('index.html').read_text(encoding='utf-8')
          leaked=[f for f in glob.glob('articles/**/*.html',recursive=True) if '```' in Path(f).read_text(encoding='utf-8',errors='ignore')]
          checks=[('no article has leaked markdown fences',not leaked),('quiz has no placeholder EmailJS config','YOUR_PUBLIC_KEY' not in quiz),('home loads article search index',"fetch('/search-index.json')" in index)]
          failed=[n for n,ok in checks if not ok]
          if failed: print('\n'.join('FAILED: '+x for x in failed)); print(leaked); raise SystemExit(1)
          print('\n'.join('OK: '+x for x,_ in checks))
          PY
