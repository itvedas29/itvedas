name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate complete sitemap
        run: python3 scripts/generate-sitemap.py

      - name: Regenerate search index
        run: python3 scripts/generate-search-index.py

      - name: Validate JSON files
        run: |
          python -m json.tool search-index.json > /tmp/search-index.json

      - name: Run security checks
        run: bash scripts/security-check.sh

      - name: Check JavaScript syntax
        run: |
          set -e
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Check generated article cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import glob

          quiz = Path('quiz.html').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          leaked_fences = []
          for f in glob.glob('articles/**/*.html', recursive=True):
              text = Path(f).read_text(encoding='utf-8', errors='ignore')
              if '```' in text:
                  leaked_fences.append(f)

          checks = [
              ('no article has a leaked markdown code fence', len(leaked_fences) == 0),
              ('quiz does not include placeholder EmailJS config', 'YOUR_PUBLIC_KEY' not in quiz),
              ('home loads article search index', "fetch('/search-index.json')" in index),
          ]

          failed = [name for name, ok in checks if not ok]
          if failed:
              for name in failed:
                  print(f'FAILED: {name}')
              if leaked_fences:
                  print('Files with leaked code fences:', leaked_fences)
              raise SystemExit(1)

          for name, _ in checks:
              print(f'OK: {name}')
          PY
