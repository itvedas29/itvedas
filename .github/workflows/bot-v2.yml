name: ITVedas Bot v2 — Auto Article Publisher

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 6am UTC
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ITVedas Bot v2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
          GA4_ID: G-D98BFZSJYP
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
        run: |
          cd itvedas-brain
          python itvedas-bot-v2.py

      - name: Commit memory + heartbeat updates
        run: |
          git config user.name "itvedas-bot"
          git config user.email "bot@itvedas.com"
          git pull --rebase origin main
          git add itvedas-brain/memory/ itvedas-brain/state/heartbeat.json || true
          git diff --cached --quiet || git commit -m "bot: update memory + heartbeat [skip ci]"
          git push origin main || true
