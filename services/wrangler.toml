# Cloudflare Pages config for the ITVedas Services project.
#
# This is a SEPARATE Pages project from the parent itvedas.com site (which
# deploys the repo root). Without this file, `wrangler pages dev services`
# walks up and picks up the root wrangler.toml — which points at the parent's
# functions/ directory, so none of the /api routes below resolve. Always pass
# `-c services/wrangler.toml` when running dev from the repo root.
#
# The site is static HTML with no build step, so the build output directory
# is this directory itself.

name = "itvedas-services"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

[observability]
enabled = true

# --- bindings --------------------------------------------------------------
# Real resource IDs, created 2026-08-10 in the "IT Vedas" Cloudflare account.
# These IDs are account-scoped identifiers, not secrets — they are safe in git.
# The binding NAMES must stay as they are: the Functions code reads env.DB,
# env.RATE_LIMIT and env.ATTACHMENTS, not the names wrangler suggests on
# creation (which derive from the resource name).

[[d1_databases]]
binding = "DB"
database_name = "itvedas-services"
database_id = "2a99624b-d574-440c-a575-03cb7dbb8d83"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c17e478324984ce4a95d167ceef47e70"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "itvedas-services-attachments"

# Runtime configuration is set entirely with `wrangler pages secret put`, not
# here:
#
#   RESEND_API_KEY         email provider key
#   EMAIL_FROM             verified sender address
#   ADMIN_NOTIFY_EMAIL     inbox for new-requirement alerts
#   ADMIN_BOOTSTRAP_TOKEN  temporary, removed after the first admin exists
#
# There is deliberately no [vars] block. A name declared here AND set as a
# secret is a duplicate binding, and the deploy fails with "Binding name
# already in use" — which is exactly what happened on the first attempt.
# Keeping all four in one place (secrets) also keeps the notification address
# out of a public repository.
